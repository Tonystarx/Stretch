<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stretch">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0E1130">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stretch Timer</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column, iOS large-title header, sticky bottom action, full-screen timer overlay, bottom sheets */
  /* Single dark theme by choice: neon Vice City pinks and blues on deep navy */
  --bg:#0E1130;
  --surface:#181C44;
  --soft:#232857;
  --raised:#323872;
  --ink:#F5F2FF;
  --muted:#A4A8D4;
  --line:#2D3366;
  --accent:#FF3C78;       /* hot pink */
  --accent-ink:#170A22;
  --left:#00CED1;         /* Vice City teal */
  --right:#FF3C78;        /* hot pink */
  --single:#C04DFF;       /* magenta, for one-sided holds */
  --prep:#FF6B35;         /* coral */
  --danger:#FF6B6B;
  --grad:linear-gradient(90deg,#2F5BFF 0%,#C04DFF 38%,#FF3C78 68%,#FF6B35 100%);
  --display:"Barlow Semi Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input{font:inherit;font-size:16px;color:var(--ink)}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.app{
  max-width:560px;margin:0 auto;min-height:100%;
  padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 140px) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:20px;
}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.topbar .spacer{flex:1}
.link-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);font-weight:600;padding:0 4px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon-btn:active{background:var(--soft)}
.icon-btn.tint{color:var(--accent)}
.large-title{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.title-input{
  font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;border:0;background:transparent;width:100%;
  padding:4px 0;border-bottom:2px solid transparent;border-radius:0;
}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 -8px}
.section-head h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}

/* Routine cards */
.cards{display:grid;gap:12px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 14px 16px 18px;
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
}
.card:active{background:var(--soft)}
.card-main{flex:1;min-width:0}
.card-title{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.card-meta{color:var(--muted);font-size:14px;margin-top:2px}
.play-fab{
  width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none;box-shadow:0 0 22px color-mix(in srgb,var(--accent) 40%,transparent);
}
.play-fab:disabled{opacity:.35}
.ghost-card{
  border:1.5px dashed var(--line);border-radius:18px;min-height:64px;color:var(--accent);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
}
.ghost-card:active{background:var(--soft)}
.footnote{color:var(--muted);font-size:13px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--accent)}
.dot.warn{background:var(--prep)}

/* Settings strip on routine page */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;gap:12px}
.strip-label{font-weight:500}
.strip-label small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.mini-stepper{display:flex;align-items:center;gap:2px}
.mini-stepper .val{min-width:52px;text-align:center;font-weight:600}
.step-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:var(--soft);font-size:22px;font-weight:600}
.step-btn:active{filter:brightness(.92)}

/* Routine item list */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  display:flex;align-items:center;gap:4px;padding:6px 4px 6px 0;min-height:64px;
  transition:transform .16s ease;position:relative;
}
.row.dragging{transition:none;z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.18);border-color:var(--accent)}
.handle{width:44px;align-self:stretch;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.row-idx{font-family:var(--display);font-weight:600;color:var(--muted);width:20px;text-align:right;flex:none;margin-right:6px}
.row-main{flex:1;min-width:0;padding:4px 0}
.row-title{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.row-sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:3px}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.lr{background:color-mix(in srgb,var(--left) 14%,transparent);color:var(--left)}
.dur-btn{min-width:60px;min-height:44px;padding:0 10px;border-radius:10px;font-weight:600;background:var(--soft)}
.dur-btn.custom{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted)}
.danger-link{color:var(--danger);font-weight:600;min-height:44px;align-self:center;padding:0 12px}

/* Sticky bottom bar */
.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:12px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(16px,env(safe-area-inset-left));
  background:linear-gradient(to top,var(--bg) 70%,transparent);
}
.bottom-bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bottom-bar .inner .btn.secondary{padding:0 14px;font-size:16px}
.dirty-note{max-width:560px;margin:0 auto 8px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.title-row{display:flex;align-items:center;gap:4px}
.title-row .title-input{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.stack .btn{width:100%}
.btn{
  min-height:54px;border-radius:16px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;
}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:disabled{opacity:.4}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff;flex:1}
.btn:active{filter:brightness(.93)}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(4,5,20,.6);animation:fade .18s ease}
.sheet{
  position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top) - 24px);
  background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);animation:rise .24s cubic-bezier(.2,.8,.2,1);overflow:hidden;
}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px 20px;gap:8px;flex:none}
.sheet-head h3{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;flex:1 1 auto;min-height:0}
.sheet-body > *{flex-shrink:0}  /* children keep full height so the body scrolls instead of clipping them */
.sheet-foot{padding:10px 16px 14px;display:flex;gap:10px;flex:none;border-top:1px solid var(--line)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.search{
  width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;
}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fig{display:block;color:currentColor}
.fig polyline{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.fig circle{fill:none;stroke:currentColor;stroke-width:4.5}
.fig .far{opacity:.42}
.fig .floor{stroke:var(--muted);stroke-width:1.6;opacity:.45}
.fig .strap{stroke-width:1.8;stroke-dasharray:3 3}
.fig.generic{opacity:.55}
.thumb{width:44px;height:44px;flex:none;border-radius:10px;background:var(--soft);color:var(--ink);padding:3px}
.thumb .fig{width:100%;height:100%}
.p-fig{height:clamp(84px,18vh,150px);aspect-ratio:1;color:var(--pc);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--pc) 45%,transparent))}
.p-fig .fig{width:100%;height:100%}
.p-fig.mirror .fig{transform:scaleX(-1)}
.sel-wrap{display:flex;flex-direction:column;gap:8px}
.sel-wrap:empty{display:none}
.sel-chips{display:flex;flex-wrap:wrap;gap:8px}
.sel-chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px 0 12px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--accent)}
.sel-chip .n{color:var(--accent);font-family:var(--display);font-weight:700}
.sel-chip .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.bank-add-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--accent)}
.bank-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bank-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.bank-row:first-child{border-top:0}
.bank-pick{flex:1;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 8px 8px 14px;text-align:left;min-width:0}
.bank-pick:active{background:var(--soft)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.bank-row.sel .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bank-name{font-weight:500;overflow-wrap:anywhere}
.bank-meta{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.text-input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%}
.text-input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.seg.seg3 button{min-height:56px;font-size:18px}
.seg button{min-height:44px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.big-stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.big-stepper .val{font-family:var(--display);font-weight:700;font-size:40px}
.big-stepper .step-btn{width:64px;height:52px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{color:var(--muted);font-size:14px;margin:0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 16px;min-height:56px}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* Player */
.player{
  position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px,env(safe-area-inset-left));
  --pc:var(--accent);
}
/* Half-screen highlight for the side in use */
.side-glow{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;z-index:0}
.side-glow[data-side="L"]{left:0;background:linear-gradient(to right,color-mix(in srgb,var(--pc) 40%,transparent),color-mix(in srgb,var(--pc) 10%,transparent) 65%,transparent)}
.side-glow[data-side="R"]{right:0;background:linear-gradient(to left,color-mix(in srgb,var(--pc) 40%,transparent),color-mix(in srgb,var(--pc) 10%,transparent) 65%,transparent)}
.side-glow.upcoming{animation:glowPulse 1.2s ease-in-out infinite alternate}
@keyframes glowPulse{from{opacity:.25}to{opacity:.7}}
.player .pinner{position:relative;z-index:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.p-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.p-count{font-weight:600;color:var(--muted)}
.p-left{color:var(--muted);font-size:15px;min-width:44px;text-align:right}
.pbar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--pc);transition:width .3s linear}
.p-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:0;padding:12px 0}
.p-phase{min-height:40px;display:flex;align-items:center;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--pc)}
.p-phase.big{font-family:var(--display);font-size:32px;letter-spacing:.05em;text-shadow:0 0 18px color-mix(in srgb,var(--pc) 55%,transparent)}
.p-name{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.08;margin:0;text-wrap:balance;max-width:20ch}
.side-pill{min-height:32px;display:inline-flex;align-items:center;padding:0 14px;border-radius:16px;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--pc) 15%,transparent);color:var(--pc)}
.side-pill:empty{visibility:hidden}
.ring{position:relative;width:min(70vw,290px,32vh);aspect-ratio:1;margin:8px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--soft)}
.ring .prog{stroke:var(--pc);transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--pc) 70%,transparent))}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:min(20vw,84px,12vh);letter-spacing:-.01em}
.p-next{color:var(--muted);font-size:15px;min-height:21px}
.p-ctrl{display:flex;align-items:center;justify-content:center;gap:28px;padding-top:8px}
.c-btn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.c-btn.main{width:84px;height:84px;background:var(--pc);color:var(--bg);box-shadow:0 0 28px color-mix(in srgb,var(--pc) 45%,transparent)}
.c-btn:active{filter:brightness(.9)}
.paused-tag{font-weight:700;color:var(--muted);letter-spacing:.1em;font-size:13px;text-transform:uppercase}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.done .badge{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.done h2{font-family:var(--display);font-weight:700;font-size:40px;margin:8px 0 0}
.stats{display:flex;gap:28px;margin-top:8px}
.stat b{display:block;font-family:var(--display);font-size:30px}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}

.field label.btn{font-size:17px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
#flash{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);opacity:0;z-index:90;
  background:var(--raised);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center}
#flash.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="player-root"></div>
<div id="sheet-root"></div>

<script>
(function(){
"use strict";

/* ---------- Starter exercise bank (full body) ---------- */
const BUILTINS = [
  ["b-neck-tilt","Neck Side Tilt",2],
  ["b-levator","Levator Scapulae Stretch",2],
  ["b-cross-shoulder","Cross-Body Shoulder Stretch",2],
  ["b-triceps","Overhead Triceps Stretch",2],
  ["b-doorway-chest","Doorway Chest Stretch",1],
  ["b-wrist-flexor","Wrist Flexor Stretch",2],
  ["b-thread","Thread the Needle",2],
  ["b-cat-cow","Cat-Cow",1],
  ["b-child","Child's Pose",1],
  ["b-sphinx","Sphinx Pose",1],
  ["b-seated-twist","Seated Spinal Twist",2],
  ["b-supine-twist","Supine Spinal Twist",2],
  ["b-side-bend","Standing Side Bend",2],
  ["b-knees-chest","Knees-to-Chest",1],
  ["b-hip-flexor","Kneeling Hip Flexor Stretch",2],
  ["b-couch","Couch Stretch",2],
  ["b-pigeon","Pigeon Pose",2],
  ["b-figure-four","Figure-Four Stretch",2],
  ["b-ninety","90/90 Hip Stretch",2],
  ["b-butterfly","Butterfly Stretch",1],
  ["b-frog","Frog Stretch",1],
  ["b-forward-fold","Seated Forward Fold",1],
  ["b-ham-stand","Standing Hamstring Stretch",2],
  ["b-ham-lying","Lying Hamstring Stretch",2],
  ["b-quad","Standing Quad Stretch",2],
  ["b-calf","Wall Calf Stretch",2],
  ["b-down-dog","Downward Dog",1],

/* ---------- Unsaved edits ----------
   Adding, removing or reordering stretches in an existing routine is held as a draft until
   Save, Save as new routine, or Discard. Time and pause changes still save right away.
   Routines created this visit save every change immediately while they're being built. */
const DRAFT_KEY = "stretch-timer-draft";
const freshIds = new Set();
let DR = (() => { try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY)); return d && d.rid && Array.isArray(d.items) ? d : null; } catch(e){ return null; } })();
function saveDraft(){ try { DR ? localStorage.setItem(DRAFT_KEY, JSON.stringify(DR)) : localStorage.removeItem(DRAFT_KEY); } catch(e){} }
function hasDraft(r){ return !!(DR && r && DR.rid === r.id); }
function workItems(r){ return hasDraft(r) ? DR.items : r.items; }
function beginEdit(r){
  if (freshIds.has(r.id)) return r.items;
  if (!hasDraft(r)) DR = {rid:r.id, items:clone(r.items)};
  return DR.items;
}
function sameOrder(a, b){ return a.length === b.length && a.every((it, i) => it.uid === b[i].uid); }
function commitEdit(r){
  if (freshIds.has(r.id)) { save(); return; }
  if (hasDraft(r) && sameOrder(DR.items, r.items)) DR = null;   // edited back to the original
  saveDraft();
}
function clearDraft(){ DR = null; saveDraft(); }
function uniqueName(base){
  const names = new Set(S.routines.map(r => (r.name || "").trim().toLowerCase()));
  if (!names.has(base.trim().toLowerCase())) return base;
  for (let i = 2; i < 100; i++) { const n = `${base} ${i}`; if (!names.has(n.toLowerCase())) return n; }
  return base;
}
function draftSave(){
  const r = getR(DR.rid); if (!r) return clearDraft();
  r.items = clone(DR.items); clearDraft(); save(); flash("Routine saved");
}
function draftSaveAsNew(name){
  const r = getR(DR.rid); if (!r) return clearDraft();
  const nr = { id:uid(), name: name || uniqueName(r.name), prep:r.prep, items: DR.items.map(it => ({...it, uid:uid()})) };
  S.routines.splice(S.routines.indexOf(r) + 1, 0, nr);
  clearDraft(); save(); flash(`Saved as "${nr.name}"`);
  return nr;
}

/* ---------- Backup and restore (data lives on this device) ---------- */
function storageNote(){
  return `<p class="footnote" id="sync-note"><span class="dot ok"></span>Saved on this device. Back up anytime in Settings.</p>`;
}
function backupName(){ return `stretch-timer-backup-${new Date().toISOString().slice(0,10)}.json`; }
async function exportBackup(){
  const data = JSON.stringify({app:"stretch-timer", exportedAt:new Date().toISOString(), state:S}, null, 2);
  const name = backupName();
  let file = null;
  try { file = new File([data], name, {type:"application/json"}); } catch(e){}
  // iPhone: the share sheet offers Save to Files, AirDrop, Mail, etc.
  if (file && navigator.canShare && navigator.share) {
    try {
      if (navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Stretch Timer backup"}); flash("Backup ready"); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
  }
  const blob = file || new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  flash("Backup downloaded");
}
function readBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let incoming = null;
    try { const j = JSON.parse(r.result); incoming = valid(j && j.state) ? j.state : (valid(j) ? j : null); } catch(e){}
    if (!incoming) { flash("That file isn't a Stretch Timer backup"); return; }
    const n = incoming.routines.length;
    confirmSheet("Restore this backup?", `This replaces everything on this device with the backup (${n} routine${n===1?"":"s"}, ${incoming.exercises.length} exercises).`, "Restore", () => {
      S = clone(incoming); migrate(S); clearDraft(); save();
      view = {name:"home"}; render(); flash("Backup restored");
    });
  };
  r.onerror = () => flash("Couldn't read that file");
  r.readAsText(file);
}
let flashT = null;
function flash(msg){
  let el = $("#flash");
  if (!el) { el = document.createElement("div"); el.id = "flash"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("show");
  clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------- Audio cues ---------- */
let AC = null;
function unlockAudio(){
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
    if (AC.state === "suspended") AC.resume();
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch(e){}
}
// iOS: "playback" lets the beeps sound in Silent mode (it also pauses other audio such as music).
function applyAudioSession(active){
  try {
    if (!navigator.audioSession) return;
    const want = active && S.settings.sound && S.settings.silentBeep !== false ? "playback" : "auto";
    if (navigator.audioSession.type !== want) navigator.audioSession.type = want;
  } catch(e){}
}
function wakeAudio(){
  try { if (AC && AC.state !== "running") AC.resume().catch(() => {}); } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && P && !P.done) wakeAudio(); });
function tone(freq, dur, when=0, gain=0.22, type="sine"){
  if (!AC || !S.settings.sound) return;
  wakeAudio();
  try {
    const t = AC.currentTime + when;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}

function findItem(rid, u){ const r = getR(rid); return r && workItems(r).find(i => i.uid === u); }

/* ---------- Player ---------- */
function buildPhases(r){
  const ph = [], sw = S.settings.switchSec || 0;
  liveItems(r).forEach((it, n) => {
    const ex = getEx(it.ex), d = itemDur(it);
    if (r.prep > 0) ph.push({t:"prep", n, ex, side: ex.sides===2 ? "L" : null, secs:r.prep, work:d});
    if (ex.sides === 2) {
      ph.push({t:"work", n, ex, side:"L", secs:d});
      if (sw > 0) ph.push({t:"switch", n, ex, side:"R", secs:sw});
      ph.push({t:"work", n, ex, side:"R", secs:d});
    } else ph.push({t:"work", n, ex, side:null, secs:d});
  });
  // suffix sums for "time left"
  let acc = 0; for (let i = ph.length-1; i >= 0; i--) { ph[i].after = acc; acc += ph[i].secs; }
  return {ph, total:acc, count: liveItems(r).length};
}
function startRoutine(id){
  const r = getR(id); if (!r) return;
  const b = buildPhases(r); if (!b.ph.length) return;
  applyAudioSession(true);
  unlockAudio();
  P = { rid:id, name:r.name, items:liveItems(r).map(it => getEx(it.ex)), ph:b.ph, total:b.total, count:b.count,
        idx:0, acc:0, start:Date.now(), paused:false, lastSec:null, done:false, startedAt:Date.now(), shownIdx:-1 };
  document.body.classList.add("locked");
  renderPlayer();
  phaseCue(P.ph[0]);
  clearInterval(P.iv); P.iv = setInterval(tick, 100);
}
function elapsed(){ return P.paused ? P.acc : P.acc + (Date.now() - P.start)/1000; }
function phaseCue(ph){ if (!ph) return; ({prep:cue.rest, work:cue.go, switch:cue.sw})[ph.t](); }
function goTo(i){
  if (i >= P.ph.length) return finish();
  P.idx = clamp(i, 0, P.ph.length-1); P.acc = 0; P.start = Date.now(); P.lastSec = null;
  if (!P.paused) phaseCue(P.ph[P.idx]);
  renderPlayer();
}
/* Skip controls step by side: every work phase (left, right, or single hold) is one stop.
   A lead-in or switch countdown belongs to the stop that follows it. */
function stopFor(i){ return P.ph[i].t === "work" ? i : Math.min(i + 1, P.ph.length - 1); }
function nextStop(){
  const w = stopFor(P.idx);
  let j = w + 1;
  while (j < P.ph.length && P.ph[j].t !== "work") j++;
  if (j >= P.ph.length) return finish();
  if (P.ph[j].n === P.ph[w].n) return goTo(j);            // other side of the same stretch, start now
  return goTo(P.ph[j-1].t === "prep" ? j - 1 : j);         // new stretch, with its 5s lead-in
}
function prevStop(){
  const w = stopFor(P.idx);
  let j = w - 1;
  while (j >= 0 && P.ph[j].t !== "work") j--;
  if (j < 0) return goTo(0);                               // already on the first side: restart it
  return goTo(j);
}
function tick(){
  if (!P || P.done) return;
  let ph = P.ph[P.idx], el = elapsed(), moved = false;
  while (el >= ph.secs) {
    const over = el - ph.secs;
    P.idx++;
    if (P.idx >= P.ph.length) return finish();
    P.acc = over; P.start = Date.now(); P.lastSec = null;
    ph = P.ph[P.idx]; el = over; moved = true;
  }
  if (moved) { if (el < 1.5) phaseCue(ph); renderPlayer(); }
  const rem = ph.secs - el, sec = Math.ceil(rem);
  if (sec !== P.lastSec) {
    if (P.lastSec !== null && sec < P.lastSec && sec >= 1 && sec <= 3 && !P.paused) cue.tick();
    P.lastSec = sec;
  }
  updateClock(ph, rem);
}
function phaseColor(ph){
  if (ph.t === "switch") return "var(--right)";
  return ph.side === "L" ? "var(--left)" : ph.side === "R" ? "var(--right)" : "var(--single)";
}
const RC = 2 * Math.PI * 54;
function renderPlayer(){

  let next;

            <stop offset="0" stop-color="#2F5BFF"/><stop offset=".38" stop-color="#C04DFF"/><stop offset=".68" stop-color="#FF3C78"/><stop offset="1" stop-color="#FF6B35"/>
          </linearGradient></defs>
          <circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>
          <circle class="prog" id="p-ring" cx="60" cy="60" r="54" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="0" ${ph.side ? "" : 'style="stroke:url(#logo-grad)"'}/></svg>
        <div class="time num" id="p-time">${mmss(ph.secs)}</div>
      </div>
      <div class="p-next">${esc(next)}</div>
      <div class="paused-tag" id="p-paused" ${P.paused?"":"hidden"}>Paused</div>
    </div>
    <div class="p-ctrl">
      <button class="c-btn" data-a="p-prev" aria-label="Previous side">${I.prev}</button>
      <button class="c-btn main" data-a="p-toggle" id="p-toggle" aria-label="${P.paused?"Resume":"Pause"}">${P.paused?I.playL:I.pauseL}</button>
      <button class="c-btn" data-a="p-next" aria-label="Next side">${I.next}</button>
    </div>
  </div></div>`;
  updateClock(ph, ph.secs - elapsed());
}
function updateClock(ph, rem){
  const t = $("#p-time"); if (!t) return;
  if (ph.t === "prep") {
    // the stretch's own screen, held at full time until the pause ends
    t.textContent = mmss(ph.work);
    $("#p-ring").setAttribute("stroke-dashoffset", "0");
    $("#p-phase").textContent = `Starts in ${Math.max(1, Math.ceil(rem))}`;
  } else {
    t.textContent = mmss(Math.ceil(rem));
    $("#p-ring").setAttribute("stroke-dashoffset", String(RC * (1 - clamp(rem/ph.secs, 0, 1))));
  }
  const left = ph.after + rem;
  $("#p-left").textContent = mmss(Math.ceil(left));

}
function finish(){

function closePlayer(){

function togglePause(){
  unlockAudio();
  if (P.paused) { P.paused = false; P.start = Date.now(); }
  else { P.acc = elapsed(); P.paused = true; }
  const b = $("#p-toggle"); if (b) { b.innerHTML = P.paused ? I.playL : I.pauseL; b.setAttribute("aria-label", P.paused ? "Resume" : "Pause"); }
  const p = $("#p-paused"); if (p) p.hidden = !P.paused;
}

/* ---------- Actions ---------- */
function confirmSheet(title, msg, ok, onOk){ openSheet({kind:"confirm", title, msg, ok, onOk}); }
function goHome(){ view = {name:"home"}; render(); window.scrollTo(0,0); }
function setItemDur(rid, u, dur){
  const r = getR(rid); if (!r) return;
  [r.items, hasDraft(r) ? DR.items : []].forEach(list => { const it = list.find(i => i.uid === u); if (it) it.dur = dur; });
  saveDraft(); save();
}

const actions = {
  "home": () => {
    if (view.name === "routine" && hasDraft(getR(view.rid))) { openSheet({kind:"unsaved", then:"home"}); return; }
    goHome();
  },
  "rename": () => { const i = $("#rname"); if (i) { i.focus(); i.select(); } },
  "draft-save": () => { const then = SH && SH.then; draftSave(); closeSheet(); then === "home" ? goHome() : render(); },
  "draft-saveas": () => {
    const r = getR(DR.rid), then = SH && SH.then;
    openSheet({kind:"saveas", name: uniqueName(r.name), then});
    setTimeout(() => { const i = $("#saveas-name"); if (i) { i.focus(); i.select(); } }, 250);
  },
  "saveas-ok": () => {
    const name = ($("#saveas-name").value || "").trim();
    if (!name) { const i = $("#saveas-name"); i.focus(); i.placeholder = "Enter a name to save"; return; }
    const then = SH.then, nr = draftSaveAsNew(name.slice(0, 60));
    closeSheet();
    if (then === "home") goHome(); else { view = {name:"routine", rid:nr.id}; render(); window.scrollTo(0,0); }
  },
  "draft-discard": () => confirmSheet("Discard changes?", "Your routine goes back to how it was before these changes.", "Discard", () => { clearDraft(); render(); }),
  "draft-discard-now": () => { const then = SH.then; clearDraft(); closeSheet(); then === "home" ? goHome() : render(); },
  "open-routine": el => { view = {name:"routine", rid:el.dataset.id}; render(); window.scrollTo(0,0); },
  "start": el => startRoutine(el.dataset.id),
  "new-routine": () => {
    const r = {id:uid(), name:uniqueName("New routine"), prep:5, items:[]};
    S.routines.push(r); freshIds.add(r.id); save();
    view = {name:"routine", rid:r.id}; render(); window.scrollTo(0,0);
    const inp = $("#rname"); if (inp) { inp.focus(); inp.select(); }
  },
  "delete-routine": () => {
    const r = getR(view.rid);
    confirmSheet("Delete routine?", `"${r.name || "Untitled routine"}" will be removed. Exercises stay in your bank.`, "Delete", () => {
      S.routines = S.routines.filter(x => x.id !== r.id); if (hasDraft(r)) clearDraft(); save(); view = {name:"home"}; render();
    });
  },
  "prep": el => {
    const r = getR(view.rid); r.prep = clamp((r.prep||0) + (+el.dataset.d), 0, 60); save();
    $("#prepval").textContent = r.prep + "s";
    const items = workItems(r).filter(it => getEx(it.ex)); $("#rtotal").textContent = `${items.length} stretch${items.length===1?"":"es"} · about ${minutesLabel(routineSecs(r, workItems(r)))}`;
  },
  "item-remove": el => {
    const r = getR(view.rid), list = beginEdit(r);
    const at = list.findIndex(i => i.uid === el.dataset.uid); if (at >= 0) list.splice(at, 1);
    commitEdit(r); render();
  },
  "item-dur": el => {
    const it = findItem(view.rid, el.dataset.uid);
    openSheet({kind:"dur", rid:view.rid, uid:el.dataset.uid, dur:itemDur(it)});
  },
  "dur-step": el => { SH.dur = clamp(SH.dur + (+el.dataset.d), 5, 600); updateDurUI(); },
  "dur-set": el => { SH.dur = +el.dataset.v; updateDurUI(); },
  "dur-save": () => {
    const it = findItem(SH.rid, SH.uid), ex = getEx(it.ex);
    setItemDur(SH.rid, SH.uid, SH.dur === ex.dur ? null : SH.dur); closeSheet(); render();
  },
  "dur-reset": () => { setItemDur(SH.rid, SH.uid, null); closeSheet(); render(); },
  "bank-add": () => openSheet({kind:"bank", mode:"add", rid:view.rid, sel:new Set(), q:""}),
  "bank-manage": () => openSheet({kind:"bank", mode:"manage", sel:new Set(), q:""}),
  "bank-toggle": el => { SH.sel.add(el.dataset.id); renderBankList(); },
  "bank-unsel": el => { SH.sel.delete(el.dataset.id); renderBankList(); },
  "bank-commit": () => {
    const r = getR(SH.rid); if (!r) return closeSheet();
    // add in the order they were tapped
    const ids = [...SH.sel].filter(id => getEx(id)), list = beginEdit(r);
    ids.forEach(ex => list.push({uid:uid(), ex, dur:null}));
    commitEdit(r); closeSheet(); render();
    setTimeout(() => window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}), 50);
  },
  "ex-new": () => { SH = {kind:"exform", id:null, name:SH.q || "", sides:2, dur:60, back:SH}; renderSheet(); setTimeout(() => $("#ex-name") && $("#ex-name").focus(), 250); },
  "ex-edit": el => { const e = getEx(el.dataset.id); SH = {kind:"exform", id:e.id, name:e.name, sides:e.sides, dur:e.dur, back:SH}; renderSheet(); },
  "ex-sides": el => {
    SH.sides = +el.dataset.v;
    document.querySelectorAll('[data-a="ex-sides"]').forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === SH.sides)));
    renderSheetKeepName();
  },
  "ex-cancel": () => backToBank(),
  "ex-save": () => {
    const name = ($("#ex-name").value || "").trim();
    if (!name) { const i = $("#ex-name"); i.focus(); i.placeholder = "Enter a name to save"; return; }
    let newId = null;
    if (SH.id) { const e = getEx(SH.id); e.name = name; e.sides = SH.sides; e.dur = SH.dur; }
    else { newId = "c-" + uid(); S.exercises.push({id:newId, name, sides:SH.sides, dur:SH.dur, builtin:false}); }
    save();
    const back = SH.back;
    if (back && back.mode === "add" && newId) back.sel.add(newId);
    if (back) back.q = "";
    backToBank();
    if (view.name === "routine") render();
  },
  "ex-delete": () => {
    const e = getEx(SH.id), uses = S.routines.reduce((a,r) => a + r.items.filter(i => i.ex === e.id).length, 0);
    const back = SH.back;
    confirmSheet("Delete exercise?", `"${e.name}" will be removed from the bank${uses ? ` and from ${uses} routine slot${uses===1?"":"s"}` : ""}.`, "Delete", () => {
      S.exercises = S.exercises.filter(x => x.id !== e.id);
      S.routines.forEach(r => r.items = r.items.filter(i => i.ex !== e.id));
      if (DR) { DR.items = DR.items.filter(i => i.ex !== e.id); const dr = getR(DR.rid); if (dr) commitEdit(dr); }
      if (back) back.sel.delete(e.id);
      save(); render();
      if (back) { SH = back; renderSheet(); return true; }
    });
  },
  "confirm-ok": () => { const fn = SH.onOk; const keep = fn && fn(); if (!keep) closeSheet(); },
  "sheet-close": () => closeSheet(),
  "settings": () => openSheet({kind:"settings"}),
  "toggle-sound": () => { S.settings.sound = !S.settings.sound; save(); renderSheet(); if (S.settings.sound) { unlockAudio(); cue.go(); } },
  "toggle-silent": () => { S.settings.silentBeep = S.settings.silentBeep === false; save(); renderSheet(); },
  "switch-sec": el => { S.settings.switchSec = +el.dataset.v; save(); renderSheet(); render(); },
  "export": () => exportBackup(),
  "restore": () => {
    builtinExercises().forEach(b => { if (!getEx(b.id)) S.exercises.push(b); });
    save(); renderSheet();
  },
  "player-end": () => {
    if (!P.paused) togglePause();
    confirmSheet("End session?", "Your progress in this run won't be kept.", "End", () => { closeSheet(); closePlayer(); return true; });
  },
  "player-close": () => closePlayer(),
  "p-toggle": () => togglePause(),
  "p-next": () => { unlockAudio(); nextStop(); },
  "p-prev": () => { unlockAudio(); prevStop(); }
};
function renderSheetKeepName(){
  const inp = $("#ex-name"); if (inp) SH.name = inp.value;
  renderSheet();
}
function backToBank(){
  const back = SH && SH.back;
  if (back) { SH = back; renderSheet(); } else closeSheet();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  // the play button sits inside a clickable card
  const a = el.dataset.a, fn = actions[a];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('.card[data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "rname") e.target.blur();
  if (e.key === "Enter" && e.target.id === "ex-name") { e.preventDefault(); actions["ex-save"](); }
  if (e.key === "Escape" && SH) closeSheet();
});
document.addEventListener("input", e => {
  if (e.target.id === "bank-q") { SH.q = e.target.value; renderBankList(); }
  if (e.target.id === "ex-name" && SH) SH.name = e.target.value;
  if (e.target.id === "rname") {
    const r = getR(view.rid); if (!r) return;
    r.name = e.target.value.slice(0, 60);
    S.updatedAt = Date.now(); saveLocal();
    clearTimeout(window.__nameT); window.__nameT = setTimeout(save, 500);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "rname") save();
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]) { readBackup(e.target.files[0]); e.target.value = ""; }
});

/* ---------- Drag to reorder ---------- */
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".handle"); if (!h || D) return;
  e.preventDefault();
  const row = h.closest(".row"), list = row.parentElement, rows = [...list.children];
  const idx = rows.indexOf(row);
  const rects = rows.map(r => r.getBoundingClientRect());
  const gap = rects.length > 1 ? rects[1].top - rects[0].bottom : 8;
  D = {row, rows, idx, to:idx, y0:e.clientY, rects, shift:rects[idx].height + gap, pid:e.pointerId};
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  row.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!D || e.pointerId !== D.pid) return;
  e.preventDefault();
  const {rects, idx} = D;
  const minDy = rects[0].top - rects[idx].top, maxDy = rects[rects.length-1].bottom - rects[idx].bottom;
  const dy = clamp(e.clientY - D.y0, minDy - 12, maxDy + 12);
  D.row.style.transform = `translateY(${dy}px)`;
  const center = rects[idx].top + rects[idx].height/2 + dy;
  let to = idx;
  for (let i = idx+1; i < rects.length; i++) if (center > rects[i].top + rects[i].height/2) to = i;
  for (let i = idx-1; i >= 0; i--) if (center < rects[i].top + rects[i].height/2) to = i;
  if (to !== D.to) {
    D.to = to;
    D.rows.forEach((r, i) => {
      if (i === idx) return;
      let s = 0;
      if (idx < to && i > idx && i <= to) s = -D.shift;
      if (idx > to && i < idx && i >= to) s = D.shift;
      r.style.transform = s ? `translateY(${s}px)` : "";
    });
  }
}, {passive:false});
function endDrag(e){
  if (!D || e.pointerId !== D.pid) return;
  const {idx, to, row} = D;
  row.classList.remove("dragging");
  D = null;
  if (to !== idx) {
    const r = getR(view.rid), list = beginEdit(r);
    const live = list.filter(it => getEx(it.ex));
    const moved = live[idx], target = live[to];
    list.splice(list.indexOf(moved), 1);
    const at = list.indexOf(target);
    list.splice(to > idx ? at + 1 : at, 0, moved);
    commitEdit(r);
  }
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
// stop iOS from scrolling the page when a drag starts on a handle
document.addEventListener("touchmove", e => { if (D) e.preventDefault(); }, {passive:false});

/* ---------- Boot ---------- */
if (migrate(S)) save();
if (DR) { if (getR(DR.rid)) view = {name:"routine", rid:DR.rid}; else clearDraft(); }
render();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
})();
</script>
